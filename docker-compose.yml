services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: smsystem_api
    env_file:
      - ./.env.production
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3001
      DB_HOST: ${DB_HOST:?DB_HOST is required}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASS: ${DB_PASS:?DB_PASS is required}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      CORE_DB_NAME: ${CORE_DB_NAME:-sms_db}
      PURCHASE_DB_NAME: ${PURCHASE_DB_NAME:-sms_purchase}
      WAREHOUSE_DB_NAME: ${WAREHOUSE_DB_NAME:-sms_warehouse}
      AUDIT_DB_NAME: ${AUDIT_DB_NAME:-sms_log}
      DB_POOL_LIMIT: ${DB_POOL_LIMIT:-20}
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST is required}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SM_LOGIN_BASE_URL: ${SM_LOGIN_BASE_URL:?SM_LOGIN_BASE_URL is required}
      SM_TASKS_BASE_URL: ${SM_TASKS_BASE_URL:-http://172.31.11.74:8086}
      WEB_ALLOWED_ORIGINS: ${WEB_ALLOWED_ORIGINS:?WEB_ALLOWED_ORIGINS is required}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-10}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-300}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-43200}
      REFRESH_TTL_SECONDS: ${REFRESH_TTL_SECONDS:-2592000}
      REFRESH_TOKEN_ENCRYPTION_KEY: ${REFRESH_TOKEN_ENCRYPTION_KEY:?REFRESH_TOKEN_ENCRYPTION_KEY is required}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
    expose:
      - "3001"
    networks:
      - smsystem_internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
    container_name: smsystem_web
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
      SPF_API_INTERNAL_URL: ${SPF_API_INTERNAL_URL:?SPF_API_INTERNAL_URL is required}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - smsystem_internal
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: smsystem_nginx
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    networks:
      - smsystem_internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  certbot:
    image: certbot/certbot:v2.11.0
    container_name: smsystem_certbot
    profiles:
      - ssl
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    networks:
      - smsystem_internal

  spf-api:
    build:
      context: ../sm_webclient/backend-sm-spf
      dockerfile: Dockerfile
    container_name: smsystem_spf_api
    environment:
      NODE_ENV: production
      PORT: 3001
      TRUST_PROXY: 1
      # Database
      DB_HOST: ${SPF_DB_HOST:-172.31.11.74}
      DB_PORT: ${SPF_DB_PORT:-3306}
      DB_USER: ${SPF_DB_USER:-smsystem_app}
      DB_PASSWORD: ${SPF_DB_PASS:?SPF_DB_PASS is required}
      DB_NAME: ${SPF_DB_NAME:-sms_client}
      CLIENT_DB_NAME: ${SPF_DB_NAME:-sms_client}
      SMS_DB_HOST: ${SPF_DB_HOST:-172.31.11.74}
      SMS_DB_PORT: ${SPF_DB_PORT:-3306}
      SMS_DB_USER: ${SPF_DB_USER:-smsystem_app}
      SMS_DB_PASSWORD: ${SPF_DB_PASS:?SPF_DB_PASS is required}
      SMS_DB_NAME: ${SPF_SMS_DB_NAME:-sms_db}
      REDIS_URL: redis://${REDIS_HOST:-172.31.11.74}:${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SMSYSTEM_API_BASE_URL: ${SPF_SMSYSTEM_API_BASE_URL:-http://api:3001}
      PORTAL_COOKIE_SECRET: ${SPF_PORTAL_COOKIE_SECRET:?SPF_PORTAL_COOKIE_SECRET is required}
      SPF_SYNC_API_KEY: ${SPF_SYNC_API_KEY:?SPF_SYNC_API_KEY is required}
      CORS_ORIGINS: ${SPF_CORS_ORIGINS:?SPF_CORS_ORIGINS is required}
      PORTAL_PUBLIC_URL: ${SPF_PORTAL_PUBLIC_URL:?SPF_PORTAL_PUBLIC_URL is required}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
    ports:
      - "127.0.0.1:3003:3001"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - smsystem_internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  spf-web:
    build:
      context: ../sm_webclient/frontend-sm-spf
      dockerfile: Dockerfile
    container_name: frontend-sm-spf
    networks:
      - smsystem_internal
    restart: unless-stopped

networks:
  smsystem_internal:
    name: smsystem_internal
    driver: bridge

